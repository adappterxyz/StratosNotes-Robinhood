# CRE project settings: cre workflow simulate|deploy <workflow> --target <name>
#
# Every target needs the chains the keeper reads Chainlink price feeds from (the testnets have no feeds):
#   ethereum-mainnet             crypto (ETH/USD, BTC/USD, SOL/USD)
#   ethereum-mainnet-arbitrum-1  equities (TSLA, NVDA, AAPL, SPY on Arbitrum One)
# RPC URLs may use ${VAR} from the shell or the env file given with -e.

# Local end-to-end run against an anvil fork of Arbitrum Sepolia (scripts/e2e-cre-evm.sh), which keeps the
# real MockKeystoneForwarder. SN_FORK_PORT is the fork's port.
local-fork:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-arbitrum-1
      url: "http://127.0.0.1:${SN_FORK_PORT}"
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
    - chain-name: ethereum-mainnet-arbitrum-1
      url: https://arb1.arbitrum.io/rpc

# Testnets: `cre workflow simulate --broadcast` writes through each chain's MockKeystoneForwarder.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-arbitrum-1
      url: https://sepolia-rollup.arbitrum.io/rpc
    - chain-name: robinhood-testnet
      url: https://rpc.testnet.chain.robinhood.com
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
    - chain-name: ethereum-mainnet-arbitrum-1
      url: https://arb1.arbitrum.io/rpc

# Mainnet: Arbitrum One. CRE cannot write to Robinhood Chain mainnet yet (services/keeper-fallback).
production-settings:
  rpcs:
    - chain-name: ethereum-mainnet-arbitrum-1
      url: https://arb1.arbitrum.io/rpc
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
