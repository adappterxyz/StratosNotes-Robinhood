# Secret NAMES only (values come from the environment or the Vault DON, never from this repo).
#  - notes-keeper-evm reads CMC_API_KEY: the CoinMarketCap Pro API key of the second-source check and the price
#    history of Atlas-priced stock tokens (packages/core/src/cmc.ts). In a simulation it comes from the environment
#    variable CMC_API_KEY_ALL (the -e env file); on a DON, from the Vault.
secretsNames:
  CMC_API_KEY:
    - CMC_API_KEY_ALL
  ATLAS_API_KEY:
    - ATLAS_API_KEY_ALL
